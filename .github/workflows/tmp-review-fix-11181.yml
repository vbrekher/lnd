name: Temporary review fix 11181
on: [push]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply documentation fix
        shell: bash
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          python3 -c "import base64,os,pathlib; p=pathlib.Path('docs/INSTALL.md'); s=p.read_text(); o=base64.b64decode(os.environ['OLD_B64']).decode(); n=base64.b64decode(os.environ['NEW_B64']).decode(); assert s.count(o)==1; p.write_text(s.replace(o,n,1))"
          git diff --check
          grep -F -- '--neutrino.validatechannels' docs/INSTALL.md
          if grep -F -- '--neutrino.validatechannels=true' docs/INSTALL.md; then exit 1; fi
          python3 -c "from pathlib import Path; bad=[(i,len(l),l) for i,l in enumerate(Path('docs/INSTALL.md').read_text().splitlines(),1) if 428 <= i <= 450 and len(l)>80]; assert not bad,bad"
      - name: Commit verified source
        shell: bash
        run: |
          git rm .github/workflows/tmp-review-fix-11181.yml
          git add docs/INSTALL.md
          git diff --cached --check
          git config user.name 'Valentin'
          git config user.email '6142607+vbrekher@users.noreply.github.com'
          git commit -m 'docs: clarify Neutrino channel validation'
          git push origin HEAD:review-fix/11181-20260919
