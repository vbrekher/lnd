name: Temporary review fix 11186
on: [push]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply review fixes
        run: |
          python3 .github/tmp_review_fix_11186.py
          python3 - <<'PY'
          from pathlib import Path

          fee = Path('sweep/fee_bumper.go')
          text = fee.read_text()

          old = ('\t// MissingInputs are inputs that the blocking fallback could not locate\n'
                 '\t// as current UTXOs or as outputs of wallet-known parents. Unlike\n'
                 '\t// SpentInputs, the spending transaction may not be known.\n')
          new = ('\t// MissingInputs are inputs that the blocking fallback could not locate\n'
                 '\t// as current UTXOs or as outputs of wallet-known unconfirmed parents.\n'
                 '\t// Unlike SpentInputs, the spending transaction may not be known.\n')
          if old not in text:
              raise SystemExit('missing MissingInputs comment')
          text = text.replace(old, new, 1)

          old = ('\t\t// A chain lookup can report an output as absent while its parent is\n'
                 '\t\t// still unconfirmed because the backend excludes mempool outputs.\n'
                 '\t\t// If the wallet knows the parent and the output index exists, keep\n'
                 '\t\t// the input retryable instead of declaring it missing.\n'
                 '\t\tif t.cfg.Wallet != nil {\n'
                 '\t\t\tparent, err := t.cfg.Wallet.FetchTx(op.Hash)\n'
                 '\t\t\tif err != nil {\n'
                 '\t\t\t\treturn nil, err\n'
                 '\t\t\t}\n'
                 '\t\t\tif parent != nil && int(op.Index) < len(parent.TxOut) {\n'
                 '\t\t\t\tcontinue\n'
                 '\t\t\t}\n'
                 '\t\t}\n')
          new = ('\t\t// A chain lookup can report an output as absent while its\n'
                 '\t\t// parent is still unconfirmed because the backend excludes\n'
                 '\t\t// mempool outputs. If the wallet knows the parent, verify that\n'
                 '\t\t// it is still unconfirmed before keeping the input retryable.\n'
                 '\t\tif t.cfg.Wallet != nil {\n'
                 '\t\t\tparent, err := t.cfg.Wallet.FetchTx(op.Hash)\n'
                 '\t\t\tif err != nil {\n'
                 '\t\t\t\treturn nil, err\n'
                 '\t\t\t}\n'
                 '\t\t\tif parent != nil && int(op.Index) < len(parent.TxOut) {\n'
                 '\t\t\t\tdetails, err := t.cfg.Wallet.GetTransactionDetails(\n'
                 '\t\t\t\t\t&op.Hash,\n'
                 '\t\t\t\t)\n'
                 '\t\t\t\tif err != nil {\n'
                 '\t\t\t\t\treturn nil, err\n'
                 '\t\t\t\t}\n'
                 '\t\t\t\tif details != nil && details.NumConfirmations == 0 {\n'
                 '\t\t\t\t\tcontinue\n'
                 '\t\t\t\t}\n'
                 '\t\t\t}\n'
                 '\t\t}\n')
          if old not in text:
              raise SystemExit('missing wallet parent fallback')
          text = text.replace(old, new, 1)

          replacements = {
              '\t\t// blocking lookup callback. Production wiring always provides it.\n':
              '\t\t// blocking lookup callback. Production wiring always\n\t\t// provides it.\n',
              '\t\t// lookup disagree. Retry instead of permanently dropping the set.\n':
              '\t\t// lookup disagree. Retry instead of permanently dropping\n\t\t// the set.\n',
              '\t\t// missing inputs are removed and the remaining inputs are retried.\n':
              '\t\t// missing inputs are removed and the remaining inputs are\n\t\t// retried.\n',
              '\t\t\t// The historical notifier can lag behind the mempool. Query\n\t\t\t// the watcher before falling back to UTXO classification so\n':
              '\t\t\t// The historical notifier can lag behind the mempool.\n\t\t\t// Query the watcher before falling back to UTXO\n\t\t\t// classification so\n',
              '\t\t\t\tlog.Debugf("Detected mempool spend of input=%v in tx=%v",\n\t\t\t\t\top, spendingTx.TxHash())\n':
              '\t\t\t\tlog.Debugf(\n\t\t\t\t\t"Detected mempool spend of input=%v in tx=%v",\n\t\t\t\t\top, spendingTx.TxHash(),\n\t\t\t\t)\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected fee_bumper fragment: {old!r}')
              text = text.replace(old, new, 1)
          fee.write_text(text)

          test = Path('sweep/fee_bumper_missing_inputs_test.go')
          text = test.read_text()
          old = '\tfor _, testCase := range tests {\n\t\ttestCase := testCase\n\t\tt.Run(testCase.name, func(t *testing.T) {\n'
          new = '\tfor _, testCase := range tests {\n\t\tt.Run(testCase.name, func(t *testing.T) {\n'
          if old not in text:
              raise SystemExit('missing loop copy fragment')
          text = text.replace(old, new, 1)

          old = '\t"github.com/lightningnetwork/lnd/input"\n\t"github.com/lightningnetwork/lnd/lnwallet/chainfee"\n'
          new = '\t"github.com/lightningnetwork/lnd/input"\n\t"github.com/lightningnetwork/lnd/lnwallet"\n\t"github.com/lightningnetwork/lnd/lnwallet/chainfee"\n'
          if old not in text:
              raise SystemExit('missing lnwallet import insertion point')
          text = text.replace(old, new, 1)

          old = ('\twallet := &MockWallet{}\n'
                 '\twallet.On("FetchTx", op.Hash).Return(parent, nil).Once()\n'
                 '\tdefer wallet.AssertExpectations(t)\n')
          new = ('\twallet := &MockWallet{}\n'
                 '\twallet.On("FetchTx", op.Hash).Return(parent, nil).Once()\n'
                 '\twallet.On("GetTransactionDetails", mock.Anything).Return(\n'
                 '\t\t&lnwallet.TransactionDetail{NumConfirmations: 0}, nil,\n'
                 '\t).Once()\n'
                 '\tdefer wallet.AssertExpectations(t)\n')
          if old not in text:
              raise SystemExit('missing wallet parent test mock')
          text = text.replace(old, new, 1)

          marker = '// TestHandleMissingInputsMempoolSpend verifies that a spender already visible\n'
          confirmed_test = (
              '// TestFindMissingInputsConfirmedWalletParent verifies that a wallet-known\n'
              '// parent alone does not keep a confirmed, spent output retryable.\n'
              'func TestFindMissingInputsConfirmedWalletParent(t *testing.T) {\n'
              '\tt.Parallel()\n\n'
              '\tinp := createTestInput(10_000, input.WitnessKeyHash)\n'
              '\top := inp.OutPoint()\n'
              '\tparent := wire.NewMsgTx(2)\n'
              '\tparent.AddTxOut(&wire.TxOut{Value: 10_000})\n\n'
              '\twallet := &MockWallet{}\n'
              '\twallet.On("FetchTx", op.Hash).Return(parent, nil).Once()\n'
              '\twallet.On("GetTransactionDetails", mock.Anything).Return(\n'
              '\t\t&lnwallet.TransactionDetail{NumConfirmations: 1}, nil,\n'
              '\t).Once()\n'
              '\tdefer wallet.AssertExpectations(t)\n\n'
              '\tpublisher := NewTxPublisher(TxPublisherConfig{\n'
              '\t\tWallet: wallet,\n'
              '\t\tIsInputUnspent: func(input.Input) (bool, error) {\n'
              '\t\t\treturn false, nil\n'
              '\t\t},\n'
              '\t})\n\n'
              '\tmissing, err := publisher.findMissingInputs([]input.Input{&inp})\n\n'
              '\trequire.NoError(t, err)\n'
              '\trequire.Contains(t, missing, op)\n'
              '}\n\n'
          )
          if marker not in text:
              raise SystemExit('missing confirmed parent insertion point')
          text = text.replace(marker, confirmed_test + marker, 1)
          test.write_text(text)
          PY
          gofmt -w sweep/fee_bumper.go sweep/fee_bumper_missing_inputs_test.go server.go
          git diff --check
      - name: Focused missing-input regression
        run: go test ./sweep -run 'TestHandleMissingInputs|TestFindMissingInputs' -count=1
      - name: Sweep package
        run: go test ./sweep -count=1
      - name: Compile root package
        run: go test . -run '^$' -count=1
      - name: Vet changed packages
        run: go vet ./sweep .
      - name: Source lint
        run: make lint-source
      - name: Commit verified source
        shell: bash
        run: |
          git rm .github/tmp_review_fix_11186.py .github/workflows/tmp-review-fix-11186.yml
          git add sweep/fee_bumper.go sweep/fee_bumper_missing_inputs_test.go server.go
          git diff --cached --check
          git config user.name 'Valentin'
          git config user.email '6142607+vbrekher@users.noreply.github.com'
          git commit -m 'sweep: harden missing-input classification'
          git push origin HEAD:review-fix/11186-20260919
