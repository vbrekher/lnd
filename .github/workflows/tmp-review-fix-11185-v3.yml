name: Temporary review fix 11185 v3
on: [push]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply fixes
        shell: bash
        env:
          OLD1: dHlwZSBkZXNjcmliZUdyYXBoQ2FjaGVLZXkgc3RydWN0IHsKCWluY2x1ZGVVbmFubm91bmNlZCBib29sCglpbmNsdWRlQXV0aFByb29mICAgYm9vbAp9CgpmdW5jIG5ld0Rlc2NyaWJlR3JhcGhDYWNoZUtleSgKCXJlcSAqbG5ycGMuQ2hhbm5lbEdyYXBoUmVxdWVzdCkgZGVzY3JpYmVHcmFwaENhY2hlS2V5IHsK
          NEW1: 
          OLD2: CQlpZiBjYWNoZWRSZXNwIDo9IHIuZGVzY3JpYmVHcmFwaFJlc3BDYWNoZVtjYWNoZUtleV07IGNhY2hlZFJlc3AgIT0gbmlsIHsKCQkJcmV0dXJuIGNhY2hlZFJlc3AsIG5pbAoJCX0K
          NEW2: CQljYWNoZWRSZXNwIDo9IHIuZGVzY3JpYmVHcmFwaFJlc3BDYWNoZVtjYWNoZUtleV0KCQlpZiBjYWNoZWRSZXNwICE9IG5pbCB7CgkJCXJldHVybiBjYWNoZWRSZXNwLCBuaWwKCQl9Cg==
          TEST_B64: 
          ENTRY_B64: 
        run: |
          python3 -c "import base64,os,pathlib; p=pathlib.Path('rpcserver.go'); s=p.read_text(); o=base64.b64decode(os.environ['OLD1']).decode(); n=base64.b64decode(os.environ['NEW1']).decode(); assert o in s; s=s.replace(o,n,1); o=base64.b64decode(os.environ['OLD2']).decode(); n=base64.b64decode(os.environ['NEW2']).decode(); assert o in s; p.write_text(s.replace(o,n,1))"
          printf '%s' "$TEST_B64" | base64 -d > rpcserver_graph_cache_test.go
          python3 -c "import base64,os,pathlib; p=pathlib.Path('docs/release-notes/release-notes-0.22.0.md'); s=p.read_text(); e=base64.b64decode(os.environ['ENTRY_B64']).decode(); m='# Bug Fixes\n\n'; assert m in s; p.write_text(s if e in s else s.replace(m,m+e,1))"
          gofmt -w rpcserver.go rpcserver_graph_cache_test.go
          git diff --check
      - name: Focused tests
        run: go test . -run '^TestDescribeGraphCache' -count=1
      - name: Compile tests
        run: go test . -run '^$' -count=1
      - name: Vet
        run: go vet .
      - name: Source lint
        run: make lint-source
      - name: Commit verified source
        shell: bash
        run: |
          git rm .github/workflows/tmp-review-fix-11185.yml .github/workflows/tmp-review-fix-11185-v2.yml .github/workflows/tmp-review-fix-11185-v3.yml
          git add rpcserver.go rpcserver_graph_cache_test.go docs/release-notes/release-notes-0.22.0.md
          git diff --cached --check
          git config user.name 'Valentin'
          git config user.email '6142607+vbrekher@users.noreply.github.com'
          git commit -m 'rpcserver: strengthen DescribeGraph cache regression'
          git push origin HEAD:review-fix/11185-20260919
