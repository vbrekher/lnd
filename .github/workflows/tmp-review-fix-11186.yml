name: Temporary review fix 11186
on: [push]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply review fixes
        run: |
          python3 .github/tmp_review_fix_11186.py
          python3 - <<'PY'
          from pathlib import Path

          fee = Path('sweep/fee_bumper.go')
          text = fee.read_text()

          old = '''\t// MissingInputs are inputs that the blocking fallback could not locate
\t// as current UTXOs or as outputs of wallet-known parents. Unlike
\t// SpentInputs, the spending transaction may not be known.
'''
          new = '''\t// MissingInputs are inputs that the blocking fallback could not locate
\t// as current UTXOs or as outputs of wallet-known unconfirmed parents.
\t// Unlike SpentInputs, the spending transaction may not be known.
'''
          if old not in text:
              raise SystemExit('missing MissingInputs comment')
          text = text.replace(old, new, 1)

          old = '''\t\t// A chain lookup can report an output as absent while its parent is
\t\t// still unconfirmed because the backend excludes mempool outputs.
\t\t// If the wallet knows the parent and the output index exists, keep
\t\t// the input retryable instead of declaring it missing.
\t\tif t.cfg.Wallet != nil {
\t\t\tparent, err := t.cfg.Wallet.FetchTx(op.Hash)
\t\t\tif err != nil {
\t\t\t\treturn nil, err
\t\t\t}
\t\t\tif parent != nil && int(op.Index) < len(parent.TxOut) {
\t\t\t\tcontinue
\t\t\t}
\t\t}
'''
          new = '''\t\t// A chain lookup can report an output as absent while its
\t\t// parent is still unconfirmed because the backend excludes
\t\t// mempool outputs. If the wallet knows the parent, verify that
\t\t// it is still unconfirmed before keeping the input retryable.
\t\tif t.cfg.Wallet != nil {
\t\t\tparent, err := t.cfg.Wallet.FetchTx(op.Hash)
\t\t\tif err != nil {
\t\t\t\treturn nil, err
\t\t\t}
\t\t\tif parent != nil && int(op.Index) < len(parent.TxOut) {
\t\t\t\tdetails, err := t.cfg.Wallet.GetTransactionDetails(
\t\t\t\t\t&op.Hash,
\t\t\t\t)
\t\t\t\tif err != nil {
\t\t\t\t\treturn nil, err
\t\t\t\t}
\t\t\t\tif details != nil && details.NumConfirmations == 0 {
\t\t\t\t\tcontinue
\t\t\t\t}
\t\t\t}
\t\t}
'''
          if old not in text:
              raise SystemExit('missing wallet parent fallback')
          text = text.replace(old, new, 1)

          replacements = {
              '\t\t// blocking lookup callback. Production wiring always provides it.\n':
              '\t\t// blocking lookup callback. Production wiring always\n\t\t// provides it.\n',
              '\t\t// lookup disagree. Retry instead of permanently dropping the set.\n':
              '\t\t// lookup disagree. Retry instead of permanently dropping\n\t\t// the set.\n',
              '\t\t// missing inputs are removed and the remaining inputs are retried.\n':
              '\t\t// missing inputs are removed and the remaining inputs are\n\t\t// retried.\n',
              '\t\t\t// The historical notifier can lag behind the mempool. Query\n\t\t\t// the watcher before falling back to UTXO classification so\n':
              '\t\t\t// The historical notifier can lag behind the mempool.\n\t\t\t// Query the watcher before falling back to UTXO\n\t\t\t// classification so\n',
              '\t\t\t\tlog.Debugf("Detected mempool spend of input=%v in tx=%v",\n\t\t\t\t\top, spendingTx.TxHash())\n':
              '\t\t\t\tlog.Debugf(\n\t\t\t\t\t"Detected mempool spend of input=%v in tx=%v",\n\t\t\t\t\top, spendingTx.TxHash(),\n\t\t\t\t)\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected fee_bumper fragment: {old!r}')
              text = text.replace(old, new, 1)
          fee.write_text(text)

          test = Path('sweep/fee_bumper_missing_inputs_test.go')
          text = test.read_text()
          old = '\tfor _, testCase := range tests {\n\t\ttestCase := testCase\n\t\tt.Run(testCase.name, func(t *testing.T) {\n'
          new = '\tfor _, testCase := range tests {\n\t\tt.Run(testCase.name, func(t *testing.T) {\n'
          if old not in text:
              raise SystemExit('missing loop copy fragment')
          text = text.replace(old, new, 1)

          old = '\t"github.com/lightningnetwork/lnd/input"\n\t"github.com/lightningnetwork/lnd/lnwallet/chainfee"\n'
          new = '\t"github.com/lightningnetwork/lnd/input"\n\t"github.com/lightningnetwork/lnd/lnwallet"\n\t"github.com/lightningnetwork/lnd/lnwallet/chainfee"\n'
          if old not in text:
              raise SystemExit('missing lnwallet import insertion point')
          text = text.replace(old, new, 1)

          old = '''\twallet := &MockWallet{}
\twallet.On("FetchTx", op.Hash).Return(parent, nil).Once()
\tdefer wallet.AssertExpectations(t)
'''
          new = '''\twallet := &MockWallet{}
\twallet.On("FetchTx", op.Hash).Return(parent, nil).Once()
\twallet.On("GetTransactionDetails", mock.Anything).Return(
\t\t&lnwallet.TransactionDetail{NumConfirmations: 0}, nil,
\t).Once()
\tdefer wallet.AssertExpectations(t)
'''
          if old not in text:
              raise SystemExit('missing wallet parent test mock')
          text = text.replace(old, new, 1)

          marker = '''// TestHandleMissingInputsMempoolSpend verifies that a spender already visible
'''
          confirmed_test = r'''// TestFindMissingInputsConfirmedWalletParent verifies that a wallet-known
// parent is not enough to keep an actually spent confirmed output retryable.
func TestFindMissingInputsConfirmedWalletParent(t *testing.T) {
\tt.Parallel()

\tinp := createTestInput(10_000, input.WitnessKeyHash)
\top := inp.OutPoint()
\tparent := wire.NewMsgTx(2)
\tparent.AddTxOut(&wire.TxOut{Value: 10_000})

\twallet := &MockWallet{}
\twallet.On("FetchTx", op.Hash).Return(parent, nil).Once()
\twallet.On("GetTransactionDetails", mock.Anything).Return(
\t\t&lnwallet.TransactionDetail{NumConfirmations: 1}, nil,
\t).Once()
\tdefer wallet.AssertExpectations(t)

\tpublisher := NewTxPublisher(TxPublisherConfig{
\t\tWallet: wallet,
\t\tIsInputUnspent: func(input.Input) (bool, error) {
\t\t\treturn false, nil
\t\t},
\t})

\tmissing, err := publisher.findMissingInputs([]input.Input{&inp})

\trequire.NoError(t, err)
\trequire.Contains(t, missing, op)
}

'''.replace('\\t', '\t')
          if marker not in text:
              raise SystemExit('missing confirmed parent insertion point')
          text = text.replace(marker, confirmed_test + marker, 1)
          test.write_text(text)
          PY
          gofmt -w sweep/fee_bumper.go sweep/fee_bumper_missing_inputs_test.go server.go
          git diff --check
      - name: Focused missing-input regression
        run: go test ./sweep -run 'TestHandleMissingInputs|TestFindMissingInputs' -count=1
      - name: Sweep package
        run: go test ./sweep -count=1
      - name: Compile root package
        run: go test . -run '^$' -count=1
      - name: Vet changed packages
        run: go vet ./sweep .
      - name: Source lint
        run: make lint-source
      - name: Commit verified source
        shell: bash
        run: |
          git rm .github/tmp_review_fix_11186.py .github/workflows/tmp-review-fix-11186.yml
          git add sweep/fee_bumper.go sweep/fee_bumper_missing_inputs_test.go server.go
          git diff --cached --check
          git config user.name 'Valentin'
          git config user.email '6142607+vbrekher@users.noreply.github.com'
          git commit -m 'sweep: harden missing-input classification'
          git push origin HEAD:review-fix/11186-20260919
