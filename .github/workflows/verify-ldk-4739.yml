name: Verify LDK 4739

on:
  push:
    branches:
      - ci/verify-ldk-4739

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Checkout LDK
        uses: actions/checkout@v4
        with:
          repository: lightningdevkit/rust-lightning
          ref: 26eecf2d007c823aebfde579dd941f7ec309855e
          path: ldk

      - name: Install Rust 1.75
        run: rustup toolchain install 1.75.0 --profile minimal --component rustfmt

      - name: Apply fix and regression test
        run: python harness/.github/scripts/apply-ldk-4739.py ldk

      - name: Format
        working-directory: ldk
        run: cargo +1.75.0 fmt

      - name: Targeted regression test
        working-directory: ldk
        run: cargo test -p lightning --lib test_duplicate_onchain_forward_claim_with_other_downstream_blocker -- --nocapture

      - name: Diff check
        working-directory: ldk
        run: git diff --check
