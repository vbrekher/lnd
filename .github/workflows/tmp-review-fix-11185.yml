name: Temporary review fix 11185

on:
  push:
    branches:
      - review-fix/11185-20260919

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.head_commit.message == 'ci: stage review fix 11185'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply review fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          rpc = Path('rpcserver.go')
          text = rpc.read_text()

          old = '''type describeGraphCacheKey struct {
\tincludeUnannounced bool
\tincludeAuthProof   bool
}

func newDescribeGraphCacheKey(
\treq *lnrpc.ChannelGraphRequest) describeGraphCacheKey {
'''
          new = '''// describeGraphCacheKey identifies a cached DescribeGraph response by every
// request field that can affect the response.
type describeGraphCacheKey struct {
\tincludeUnannounced bool
\tincludeAuthProof   bool
}

// newDescribeGraphCacheKey returns the cache key for a DescribeGraph request.
func newDescribeGraphCacheKey(
\treq *lnrpc.ChannelGraphRequest) describeGraphCacheKey {
'''
          if old not in text:
              raise SystemExit('describeGraphCacheKey block not found')
          text = text.replace(old, new, 1)

          old = '''\t\tif cachedResp := r.describeGraphRespCache[cacheKey]; cachedResp != nil {
\t\t\treturn cachedResp, nil
\t\t}
'''
          new = '''\t\tcachedResp := r.describeGraphRespCache[cacheKey]
\t\tif cachedResp != nil {
\t\t\treturn cachedResp, nil
\t\t}
'''
          if old not in text:
              raise SystemExit('cache lookup block not found')
          text = text.replace(old, new, 1)
          rpc.write_text(text)

          test = Path('rpcserver_graph_cache_test.go')
          test.write_text('''package lnd

import (
\t"testing"
\t"time"

\tgraphdb "github.com/lightningnetwork/lnd/graph/db"
\t"github.com/lightningnetwork/lnd/lncfg"
\t"github.com/lightningnetwork/lnd/lnrpc"
\t"github.com/lightningnetwork/lnd/lnwire"
\t"github.com/stretchr/testify/require"
)

// TestDescribeGraphCacheKeyFields makes additions to ChannelGraphRequest fail
// loudly until the cache key is reviewed and updated for the new request
// shape.
func TestDescribeGraphCacheKeyFields(t *testing.T) {
\tt.Parallel()

\tfields := (&lnrpc.ChannelGraphRequest{}).
\t\tProtoReflect().Descriptor().Fields()
\trequire.Equal(t, 2, fields.Len(),
\t\t"update describeGraphCacheKey for ChannelGraphRequest changes")
}

// TestDescribeGraphCacheByRequest verifies that DescribeGraph itself stores
// and retrieves independent cached responses for distinct request shapes.
func TestDescribeGraphCacheByRequest(t *testing.T) {
\tt.Parallel()

\tgraph := graphdb.NewVersionedGraph(
\t\tgraphdb.MakeTestGraph(t), lnwire.GossipVersion1,
\t)
\trequire.NoError(t, graph.Start())
\tt.Cleanup(func() {
\t\trequire.NoError(t, graph.Stop())
\t})

\tr := &rpcServer{
\t\tcfg: &Config{
\t\t\tCaches: &lncfg.Caches{
\t\t\t\tRPCGraphCacheDuration: time.Hour,
\t\t\t},
\t\t},
\t\tserver: &server{v1Graph: graph},
\t}

\tplainReq := &lnrpc.ChannelGraphRequest{}
\tplainResp, err := r.DescribeGraph(t.Context(), plainReq)
\trequire.NoError(t, err)

\t// Mutating the first response gives us a sentinel that only a cache hit
\t// for the same request may observe.
\tplainResp.Nodes = []*lnrpc.LightningNode{{Alias: "cached-sentinel"}}

\tprivateReq := &lnrpc.ChannelGraphRequest{IncludeUnannounced: true}
\tprivateResp, err := r.DescribeGraph(t.Context(), privateReq)
\trequire.NoError(t, err)
\trequire.Empty(t, privateResp.Nodes)
\trequire.NotSame(t, plainResp, privateResp)

\tcachedResp, err := r.DescribeGraph(t.Context(), plainReq)
\trequire.NoError(t, err)
\trequire.Same(t, plainResp, cachedResp)
\trequire.Equal(t, "cached-sentinel", cachedResp.Nodes[0].Alias)
}
''')

          notes = Path('docs/release-notes/release-notes-0.22.0.md')
          text = notes.read_text()
          marker = '# Bug Fixes\n\n'
          entry = '''* [Fixed `DescribeGraph` response caching](https://github.com/lightningnetwork/lnd/pull/11185)
  so responses are keyed by both `include_unannounced` and
  `include_auth_proof`, preventing one request shape from receiving a cached
  response generated for another.\n\n'''
          if entry not in text:
              if marker not in text:
                  raise SystemExit('Bug Fixes heading not found')
              text = text.replace(marker, marker + entry, 1)
              notes.write_text(text)
          PY

          gofmt -w rpcserver.go rpcserver_graph_cache_test.go
          git diff --check

      - name: Check changed Go line lengths
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess

          diff = subprocess.check_output(
              ['git', 'diff', '--unified=0', '--', 'rpcserver.go',
               'rpcserver_graph_cache_test.go'],
              text=True,
          )
          bad = []
          for line in diff.splitlines():
              if not line.startswith('+') or line.startswith('+++'):
                  continue
              value = line[1:]
              col = 0
              for ch in value:
                  if ch == '\t':
                      col += 8 - (col % 8)
                  else:
                      col += 1
              if col > 80 and 'nolint: ll' not in value:
                  bad.append((col, value))
          if bad:
              for col, value in bad:
                  print(f'{col}: {value}')
              raise SystemExit('new Go line exceeds 80 columns')
          PY

      - name: Focused cache regression
        run: go test . -run '^TestDescribeGraphCache' -count=1

      - name: Compile root package tests
        run: go test . -run '^$' -count=1

      - name: Vet root package
        run: go vet .

      - name: Repository source lint
        run: make lint-source

      - name: Commit verified source only
        shell: bash
        run: |
          git rm .github/workflows/tmp-review-fix-11185.yml
          git add rpcserver.go rpcserver_graph_cache_test.go \
            docs/release-notes/release-notes-0.22.0.md
          git diff --cached --check
          git config user.name 'Valentin'
          git config user.email '6142607+vbrekher@users.noreply.github.com'
          git commit -m 'rpcserver: strengthen DescribeGraph cache regression'
          git push origin HEAD:review-fix/11185-20260919
